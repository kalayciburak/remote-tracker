spring:
  application:
    name: remote-tracker
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5433}/${DB_NAME:remote_tracker}
    username: ${DB_USER:remote_tracker}
    password: ${DB_PASSWORD:remote_tracker}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate.dialect: org.hibernate.dialect.PostgreSQLDialect
      hibernate.jdbc.time_zone: Europe/Istanbul
      hibernate.format_sql: false
  web:
    locale: tr_TR
    error:
      include-message: always
      include-binding-errors: always

server:
  port: ${SERVER_PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha

logging:
  level:
    root: INFO
    com.team.remotetracker: INFO
    org.springframework.security: WARN

app:
  security:
    jwt-secret: ${JWT_SECRET:change-me-in-production-must-be-at-least-32-bytes-long-secret-key}
    jwt-ttl-hours: ${JWT_TTL_HOURS:24}
    cors-origins: ${CORS_ORIGINS:http://localhost:5173,http://localhost:3000}
    bootstrap-username: ${BOOTSTRAP_USERNAME:tbyte}
  seed:
    initial-user-password: ${INITIAL_USER_PASSWORD:Tbyte123!}
